[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/enhanced"
  to = "/.netlify/functions/enhanced-report"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
